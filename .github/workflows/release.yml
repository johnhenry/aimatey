name: Release

# Publish model: main is the release branch. See johnhenry/workflows' README.
# On every push to main, changesets/action either opens/updates the
# "Version Packages" PR (when changesets are pending) or, when that PR has just
# been merged, runs scripts/staggered-publish.sh. Versions already on the
# registry are skipped, so re-runs are safe. The action creates a git tag and a
# GitHub Release per published package; nobody creates those by hand.
on:
  push:
    branches: [main]
  # Re-run from the Actions tab: publishes whatever versions are missing.
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    name: Version PR or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build before tests: the centralized test suite imports packages'
      # built dist output (matches the CI workflow's ordering)
      - name: Build project
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          # The root package is private; the staggered script publishes every
          # workspace in dependency order; the step below then verifies each
          # version on the registry (fails the job if one never appears).
          publish: ./scripts/staggered-publish.sh
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          DELAY_BETWEEN_PACKAGES: '2'
          DELAY_BETWEEN_BATCHES: '5'

      - name: Verify published versions are on the registry
        if: steps.changesets.outputs.published == 'true'
        uses: johnhenry/workflows/.github/actions/verify-published@v1
        with:
          from-workspaces: true
          timeout-minutes: 10
          interval-seconds: 20

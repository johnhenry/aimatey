name: Release

on:
  release:
    types: [published]
  # Manual trigger from the Actions tab (publishes whatever versions are on
  # the selected branch; versions already on the registry are skipped, so a
  # re-dispatch only publishes what is missing)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build before tests: the centralized test suite imports packages'
      # built dist output (matches the CI workflow's ordering)
      - name: Build project
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # id-token: write lets npm publish through trusted publishing (each
    # package trusts this repo's release.yml) and sign provenance.
    # NPM_TOKEN below is only a fallback until it's removed.
    permissions:
      contents: read
      id-token: write
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to NPM (workspaces, dependency order)
        # The root package is private; publish every workspace via the
        # staggered script. npm auth comes from setup-node's registry-url
        # + NODE_AUTH_TOKEN. Shorter delays than local defaults — CI runners
        # rarely trip npm rate limits.
        run: ./scripts/staggered-publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DELAY_BETWEEN_PACKAGES: '2'
          DELAY_BETWEEN_BATCHES: '5'
          # Post-publish `npm view` polling; the script exits non-zero (and
          # so fails this job) if any published version never appears.
          VERIFY_TIMEOUT: '10'
          VERIFY_INTERVAL: '20'
